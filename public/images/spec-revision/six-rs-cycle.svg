<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Six Rs of responsible design</title><desc id="desc">Six sequential design strategies: rethink, refuse, reduce, reuse, repair and recycle.</desc><rect width="900" height="300" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle" font-size="20" font-weight="bold"><rect x="30" y="100" width="128" height="88" rx="14" fill="#c7d2fe"/><rect x="172" y="100" width="128" height="88" rx="14" fill="#bfdbfe"/><rect x="314" y="100" width="128" height="88" rx="14" fill="#a7f3d0"/><rect x="456" y="100" width="128" height="88" rx="14" fill="#bbf7d0"/><rect x="598" y="100" width="128" height="88" rx="14" fill="#fde68a"/><rect x="740" y="100" width="128" height="88" rx="14" fill="#fecaca"/><g fill="#0f172a"><text x="94" y="151">Rethink</text><text x="236" y="151">Refuse</text><text x="378" y="151">Reduce</text><text x="520" y="151">Reuse</text><text x="662" y="151">Repair</text><text x="804" y="151">Recycle</text></g><text x="450" y="53" font-size="25" fill="#0f172a">Six Rs — product life-cycle decisions</text></g><path d="M165 144h6m136 0h6m136 0h6m136 0h6m136 0h6" stroke="#334155" stroke-width="4"/><text x="450" y="240" font-family="sans-serif" text-anchor="middle" font-size="16" fill="#334155">Prioritise preventing waste before managing materials at end of life.</text></svg>