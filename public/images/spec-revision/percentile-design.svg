<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" role="img" aria-labelledby="title desc"><title id="title">Selecting anthropometric percentiles</title><desc id="desc">Three cases: use small-user data for reach, large-user data for clearance and adjustment for a broad range.</desc><rect width="860" height="260" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle"><g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><rect x="46" y="48" width="230" height="155" rx="12"/><rect x="315" y="48" width="230" height="155" rx="12"/><rect x="584" y="48" width="230" height="155" rx="12"/></g><g fill="#0f172a"><text x="161" y="83" font-size="20" font-weight="bold">REACH</text><text x="430" y="83" font-size="20" font-weight="bold">CLEARANCE</text><text x="699" y="83" font-size="20" font-weight="bold">ADJUSTABILITY</text><text x="161" y="122" font-size="18">Smaller users</text><text x="430" y="122" font-size="18">Larger users</text><text x="699" y="122" font-size="18">Range of users</text><text x="161" y="157" font-size="16">e.g. 5th percentile</text><text x="430" y="157" font-size="16">e.g. 95th percentile</text><text x="699" y="157" font-size="16">e.g. adjustable chair</text><text x="430" y="241" font-size="15">Select data for the correct user population and body dimension.</text></g></g></svg>