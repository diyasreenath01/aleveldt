<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="t d"><title id="t">Evolution of portable music technology</title><desc id="d">Timeline from cassette player through CD and MP3 players to smartphone streaming.</desc><rect width="1100" height="360" rx="24" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">Portable Music: How Technology Changed the Product</text><g font-family="Arial,sans-serif"><path d="M130 190 H970" stroke="#94a3b8" stroke-width="5"/><g fill="#2563eb"><circle cx="150" cy="190" r="9"/><circle cx="350" cy="190" r="9"/><circle cx="550" cy="190" r="9"/><circle cx="750" cy="190" r="9"/><circle cx="950" cy="190" r="9"/></g><rect x="95" y="90" width="110" height="90" rx="10" fill="#334155"/><rect x="112" y="108" width="76" height="45" rx="4" fill="#e2e8f0"/><circle cx="135" cy="131" r="12" fill="#94a3b8"/><circle cx="165" cy="131" r="12" fill="#94a3b8"/><text x="150" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Cassette</text><text x="150" y="247" text-anchor="middle" font-size="13" fill="#64748b">magnetic tape</text><rect x="295" y="95" width="110" height="80" rx="18" fill="#475569"/><circle cx="350" cy="135" r="30" fill="#cbd5e1"/><circle cx="350" cy="135" r="8" fill="#64748b"/><text x="350" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">CD player</text><text x="350" y="247" text-anchor="middle" font-size="13" fill="#64748b">laser reads digital disc</text><rect x="505" y="85" width="90" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="520" y="100" width="60" height="38" fill="#93c5fd"/><circle cx="550" cy="160" r="14" fill="#2563eb"/><text x="550" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">MP3 player</text><text x="550" y="247" text-anchor="middle" font-size="13" fill="#64748b">compressed digital files</text><rect x="710" y="78" width="80" height="112" rx="15" fill="#172033"/><rect x="720" y="90" width="60" height="70" rx="5" fill="#60a5fa"/><circle cx="750" cy="175" r="7" fill="#e2e8f0"/><text x="750" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Flash player</text><text x="750" y="247" text-anchor="middle" font-size="13" fill="#64748b">solid-state storage</text><rect x="915" y="72" width="70" height="122" rx="14" fill="#172033"/><rect x="923" y="83" width="54" height="91" rx="6" fill="#bfdbfe"/><path d="M934 125 q16-18 32 0 M940 134 q10-11 20 0" fill="none" stroke="#2563eb" stroke-width="4"/><text x="950" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Smartphone</text><text x="950" y="247" text-anchor="middle" font-size="13" fill="#64748b">wireless streaming</text><text x="550" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">Physical media → digital storage → online access</text><text x="550" y="330" text-anchor="middle" font-size="14" fill="#64748b">Each development reduced dependence on bulky mechanisms and local physical media</text></g></svg>