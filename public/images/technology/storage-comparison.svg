<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">Hard disk drive and flash memory comparison</title><desc id="d">Labelled educational comparison of mechanical hard disk storage and solid-state flash memory.</desc><rect width="1000" height="390" rx="24" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">Storage Technology: Moving Parts → Solid State</text><g font-family="Arial,sans-serif"><rect x="65" y="75" width="400" height="250" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="205" cy="185" r="75" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><circle cx="205" cy="185" r="19" fill="#94a3b8"/><path d="M320 235 L245 190" stroke="#334155" stroke-width="9"/><circle cx="320" cy="235" r="13" fill="#334155"/><path d="M245 190 l22 -4 -10 18z" fill="#ef4444"/><text x="205" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">SPINNING PLATTER</text><path d="M205 112 V135" stroke="#2563eb" stroke-width="2"/><text x="355" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#ef4444">READ/WRITE HEAD</text><path d="M330 170 L270 188" stroke="#ef4444" stroke-width="2"/><text x="265" y="285" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">Hard disk drive (HDD)</text><text x="265" y="309" text-anchor="middle" font-size="14" fill="#64748b">mechanical • vulnerable to shock</text><rect x="535" y="75" width="400" height="250" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="630" y="115" width="210" height="130" rx="10" fill="#166534"/><g fill="#172033"><rect x="655" y="140" width="62" height="42" rx="4"/><rect x="753" y="140" width="62" height="42" rx="4"/><rect x="655" y="195" width="62" height="30" rx="4"/><rect x="753" y="195" width="62" height="30" rx="4"/></g><text x="735" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">NAND FLASH CHIPS</text><path d="M735 108 V137" stroke="#2563eb" stroke-width="2"/><text x="735" y="285" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">Flash memory / SSD</text><text x="735" y="309" text-anchor="middle" font-size="14" fill="#64748b">no moving parts • shock resistant • low power</text><text x="500" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">Solid-state storage helped portable products become thinner and more durable</text></g></svg>