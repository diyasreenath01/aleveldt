<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">Evolution from thermionic valves to integrated circuits</title><desc id="d">A labelled educational diagram showing thermionic valve, transistor and integrated circuit becoming smaller and more efficient.</desc><rect width="1000" height="360" rx="24" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">Miniaturisation of Electronics</text><g font-family="Arial,sans-serif"><rect x="70" y="85" width="230" height="205" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><path d="M150 220 Q125 170 150 115 L220 115 Q245 170 220 220 Z" fill="#e8eef6" stroke="#475569" stroke-width="3"/><path d="M165 205 L165 145 M185 205 L185 135 M205 205 L205 145" stroke="#f59e0b" stroke-width="5"/><text x="185" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Thermionic valve</text><text x="185" y="278" text-anchor="middle" font-size="14" fill="#64748b">large • hot • high power use</text><path d="M320 180 H385" stroke="#64748b" stroke-width="4"/><path d="M385 180 l-14 -9 v18z" fill="#64748b"/><rect x="405" y="85" width="190" height="205" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><path d="M480 135 h40 l18 38 -18 38 h-40 l-18-38z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M482 210 l-20 38 M500 211 v42 M518 210 l20 38" stroke="#475569" stroke-width="4"/><text x="500" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Transistor</text><text x="500" y="278" text-anchor="middle" font-size="14" fill="#64748b">smaller • cooler • efficient</text><path d="M615 180 H680" stroke="#64748b" stroke-width="4"/><path d="M680 180 l-14 -9 v18z" fill="#64748b"/><rect x="700" y="85" width="230" height="205" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="775" y="125" width="80" height="80" rx="7" fill="#172033"/><g stroke="#475569" stroke-width="4"><path d="M775 138 h-25 M775 155 h-25 M775 172 h-25 M775 189 h-25 M855 138 h25 M855 155 h25 M855 172 h25 M855 189 h25"/></g><circle cx="815" cy="165" r="17" fill="#60a5fa"/><text x="815" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Integrated circuit (IC)</text><text x="815" y="278" text-anchor="middle" font-size="14" fill="#64748b">many transistors on one chip</text><text x="500" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">Smaller components → smaller, lighter and more powerful products</text></g></svg>