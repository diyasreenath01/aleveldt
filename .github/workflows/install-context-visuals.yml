name: Install contextual visuals
on:
  push:
    paths:
      - '.github/workflows/install-context-visuals.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visual library to site layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/layouts/Base.astro')
          s=p.read_text()
          tag='<script src="/context-visuals.js" defer></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/layouts/Base.astro
          if ! git diff --cached --quiet; then
            git commit -m "Enable contextual real images across revision notes"
            git push
          fi